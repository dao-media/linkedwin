# fly.toml app configuration file generated for linkedwin-worker
app = "linkedwin-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PLAYWRIGHT_ENABLED = "true"
  PLAYWRIGHT_HEADLESS = "true"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[processes]
  worker = "npx tsx worker/process-jobs.ts"

# Long-running poller — keep one machine up, or hit /api/worker/run from
# Vercel cron (metrics only on Vercel; browser jobs stay pending for this worker).
